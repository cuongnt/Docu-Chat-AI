name: Build Windows .exe

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/local-rag/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub Actions tab

jobs:
  build:
    runs-on: windows-2022
    # windows-latest hiện dùng VS 2026 (version 18) - node-gyp chưa nhận ra
    # windows-2022 có VS 2022 (version 17) được node-gyp hỗ trợ đầy đủ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSBuild (Visual Studio Build Tools)
        uses: microsoft/setup-msbuild@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Remove Linux-only platform overrides from pnpm-workspace.yaml
        shell: pwsh
        run: |
          # pnpm-workspace.yaml excludes all Windows binaries (optimized for Replit/Linux).
          # On Windows CI we need them, so strip those override lines before installing.
          $content = Get-Content pnpm-workspace.yaml -Raw
          # Remove lines that set Windows/non-Linux platform packages to "-"
          $content = $content -replace '(?m)^\s*"esbuild>@esbuild/win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"rollup>@rollup/rollup-win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"@tailwindcss/oxide>@tailwindcss/oxide-win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"lightningcss>lightningcss-win32[^"]*":\s*["''-]+\r?\n', ''
          Set-Content pnpm-workspace.yaml $content
          Write-Host "Patched pnpm-workspace.yaml — Windows platform overrides removed"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Download prebuilt better-sqlite3 for Electron 33
        shell: pwsh
        run: |
          # better-sqlite3 v11+ has prebuilt binaries for Electron 33.
          # Run prebuild-install from the pnpm virtual store path.
          # npmRebuild=false in package.json prevents electron-builder from recompiling.
          $pkg = Get-ChildItem "node_modules/.pnpm" -Directory -Filter "better-sqlite3@*" | Select-Object -First 1
          if ($pkg) {
            $path = Join-Path $pkg.FullName "node_modules/better-sqlite3"
            Write-Host "Found better-sqlite3 at: $path"
            cd $path
            npx prebuild-install --runtime electron --target 33.4.11 --arch x64
            Write-Host "prebuild-install completed"
          } else {
            Write-Host "WARNING: better-sqlite3 not found in pnpm store"
          }
        continue-on-error: true

      - name: Build app
        working-directory: artifacts/local-rag
        run: pnpm build

      - name: Package as Windows installer
        working-directory: artifacts/local-rag
        run: |
          npm install -g electron-builder
          electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: '2022'
          # Force C++20 for MSVC — Electron 33 headers require it
          # node-gyp bundled in older electron-builder can wrongly override to C++17
          npm_config_node_gyp_force_process_config: 'true'

      - name: Upload .exe installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Installer
          path: artifacts/local-rag/release/*.exe
          if-no-files-found: warn

      - name: Upload portable folder (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Portable
          path: artifacts/local-rag/release/win-unpacked/
          if-no-files-found: warn

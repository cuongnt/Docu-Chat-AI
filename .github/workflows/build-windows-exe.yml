name: Build Windows .exe

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/local-rag/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild (Visual Studio Build Tools)
        uses: microsoft/setup-msbuild@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        shell: pwsh
        run: |
          # Xóa lockfile Linux để pnpm tạo lại với Windows optional deps
          # (e.g. @rollup/rollup-win32-x64-msvc)
          if (Test-Path pnpm-lock.yaml) { Remove-Item pnpm-lock.yaml }
          pnpm install --ignore-scripts

      - name: Rebuild native modules for Electron
        working-directory: artifacts/local-rag
        shell: pwsh
        run: |
          npx --yes @electron/rebuild -f -w better-sqlite3
        env:
          npm_config_msvs_version: '2022'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'

      - name: Build app
        working-directory: artifacts/local-rag
        run: pnpm build

      - name: Package as Windows installer
        working-directory: artifacts/local-rag
        run: |
          npm install -g electron-builder
          electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Installer
          path: artifacts/local-rag/release/*.exe
          if-no-files-found: warn

      - name: Upload portable folder (backup)
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Portable
          path: artifacts/local-rag/release/win-unpacked/
          if-no-files-found: warn

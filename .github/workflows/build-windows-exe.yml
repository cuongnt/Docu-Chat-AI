name: Build Windows .exe

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/local-rag/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Remove Linux-only platform overrides from pnpm-workspace.yaml
        shell: pwsh
        run: |
          $content = Get-Content pnpm-workspace.yaml -Raw
          $content = $content -replace '(?m)^\s*"esbuild>@esbuild/win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"rollup>@rollup/rollup-win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"@tailwindcss/oxide>@tailwindcss/oxide-win32[^"]*":\s*["''-]+\r?\n', ''
          $content = $content -replace '(?m)^\s*"lightningcss>lightningcss-win32[^"]*":\s*["''-]+\r?\n', ''
          Set-Content pnpm-workspace.yaml $content
          Write-Host "Patched pnpm-workspace.yaml"

      - name: Install dependencies (scripts enabled so node-llama-cpp downloads binary)
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_msvs_version: '2022'

      - name: Build app (TypeScript + Vite)
        working-directory: artifacts/local-rag
        run: pnpm build

      - name: Flatten pnpm junctions into real files for electron-builder
        shell: pwsh
        run: |
          # pnpm creates Windows junctions (like symlinks) in node_modules that
          # point to the virtual store (.pnpm). electron-builder does not reliably
          # follow junctions, so native binaries are missing → NoBinaryFoundError.
          #
          # PowerShell Copy-Item DOES follow junctions and hardlinks, producing
          # a real directory tree with actual files that electron-builder can read.
          $src  = "artifacts\local-rag\node_modules"
          $flat = "artifacts\local-rag\node_modules_flat"

          Write-Host "Copying node_modules (following junctions to real files)..."
          Copy-Item -Path $src -Destination $flat -Recurse -Force
          Write-Host "Copy done"

          # Verify critical packages are present
          foreach ($pkg in @("better-sqlite3", "node-llama-cpp", "mammoth", "xlsx", "pdf-parse")) {
            $p = Join-Path $flat $pkg
            if (Test-Path $p) { Write-Host "  ✓ $pkg" }
            else               { Write-Host "  ✗ $pkg MISSING" }
          }

          # Check node-llama-cpp bins (the native llama.cpp binary)
          $binsDir = Join-Path $flat "node-llama-cpp\bins"
          if (Test-Path $binsDir) {
            Write-Host "node-llama-cpp/bins:"
            Get-ChildItem $binsDir -Recurse | Select-Object -ExpandProperty FullName |
              ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "WARNING: node-llama-cpp/bins not found — binary may be missing"
          }

          # Swap: replace junction-based node_modules with flat real-file version
          Remove-Item -Recurse -Force $src
          Rename-Item $flat "node_modules"
          Write-Host "Replaced node_modules with flat version"

      - name: Overwrite better-sqlite3 with Electron 33 prebuilt
        shell: pwsh
        run: |
          $bsqlPath = "artifacts\local-rag\node_modules\better-sqlite3"
          if (Test-Path $bsqlPath) {
            Write-Host "Installing Electron 33 prebuilt for better-sqlite3"
            Push-Location $bsqlPath
            npx prebuild-install --runtime electron --target 33.4.11 --arch x64
            Pop-Location
            Write-Host "Done"
          } else {
            Write-Host "WARNING: better-sqlite3 not found at $bsqlPath"
          }
        continue-on-error: true

      - name: Package as Windows installer
        working-directory: artifacts/local-rag
        run: |
          npm install -g electron-builder
          electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: '2022'

      - name: Upload .exe installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Installer
          path: artifacts/local-rag/release/*.exe
          if-no-files-found: warn

      - name: Upload portable folder (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocChatAI-Windows-Portable
          path: artifacts/local-rag/release/win-unpacked/
          if-no-files-found: warn
